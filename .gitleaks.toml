title = "Ledgerlane gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known expired debug token (git history only) and test fixtures"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpZCI6IjAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMCIs[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''',
]
paths = [
  '''.github/workflows/.*''',
  '''backend/scripts/.*''',
  '''backend/src/__tests__/.*''',
  '''package-lock\.json''',
  '''api/index\.js''',
]
