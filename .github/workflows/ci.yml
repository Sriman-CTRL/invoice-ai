name: FinTech Security & Compliance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Security, Compliance & Unit Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice_admin
          POSTGRES_PASSWORD: invoice_dev_password
          POSTGRES_DB: invoice_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Sync Database Schema & Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://invoice_admin:invoice_dev_password@localhost:5432/invoice_ai"
        run: |
          npx prisma db push
          npx prisma generate

      - name: Apply tenant-isolation (row-level security) setup
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://invoice_admin:invoice_dev_password@localhost:5432/invoice_ai"
          APP_DB_PASSWORD: "ci_throwaway_role_password_not_a_secret"
        run: node scripts/enable-rls.cjs

      - name: Run Backend Unit, Security & Compliance Test Suite (as the restricted app role)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://invoice_admin:invoice_dev_password@localhost:5432/invoice_ai"
          DATABASE_URL_APP: "postgresql://app_user:ci_throwaway_role_password_not_a_secret@localhost:5432/invoice_ai"
          JWT_SECRET: "test_secret_for_ci_pipeline_verification_32chars"
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Show which tests failed
        if: failure()
        working-directory: ./backend
        run: |
          grep -E "^[[:space:]]*(✖|not ok)|Error:|expected|actual|timed out|failureType" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Verify Backend TypeScript Build
        working-directory: ./backend
        run: npm run build

      - name: Verify Frontend Production Build
        run: npm run build
