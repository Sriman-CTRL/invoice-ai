name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --exit-code 0 --report-format json --report-path leaks.json
          node -e '
            const r = require("fs").existsSync("leaks.json") ? JSON.parse(require("fs").readFileSync("leaks.json", "utf8")) : [];
            for (const f of r) console.log("::error file=" + f.File + ",line=" + f.StartLine + "::" + f.RuleID + " in commit " + String(f.Commit).slice(0, 7));
            if (r.length) { console.log(r.length + " potential secret(s) found"); process.exit(1); }
            console.log("No secrets found");
          '

  code:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/typescript --config p/react --config p/nodejs --config p/secrets \
            --exclude node_modules --exclude dist --exclude api/index.js --exclude src/generated \
            --severity ERROR --error

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Audit frontend (production deps, fail on critical)
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit backend (production deps, fail on critical)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=critical
